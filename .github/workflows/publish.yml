# Publish to npmjs.org through npm trusted publishing (OIDC).
#
# There is no NPM_TOKEN, and there must never be one. npm mints a short-lived
# credential from this workflow's own OIDC identity, which is what `id-token:
# write` below buys — without it the publish fails with a 401/404 that reads
# like a permissions problem and is not one.
#
# ONE-TIME SETUP, on npmjs.com, by the maintainer: under the package's Settings
# → Trusted Publisher, name this repository (`light-merlin-dark/vssh`) and this
# workflow's filename (`publish.yml`). Until that record exists the workflow
# cannot publish and should not be expected to. It is also what makes a token
# unnecessary, so do it rather than reaching for one.
#
# Publishing is deliberately manual and bound to an exact commit and an exact
# version: a tag push is easy to fire by accident, and a release that cannot
# name the commit it came from is not auditable.
name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string
      commit:
        description: Exact main-branch commit to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    # Trusted publishing does not support self-hosted runners.
    runs-on: ubuntu-latest
    steps:
      # Check out the requested commit, not whatever `main` points at now.
      # Binding to the branch tip means any commit landed between staging a
      # release and dispatching it invalidates the dispatch — which is exactly
      # what happened on the first 2.0.1 attempt. The commit is still required
      # to be on `main`; that is asserted below rather than assumed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Tests run under Bun, pinned to the same version as `packageManager`.
      # End users still need only Node; this is a development dependency.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Refuse to publish anything other than exactly what was asked for: the
      # checkout must BE the requested commit, that commit must be an ancestor
      # of `main` (so an unmerged branch cannot be published), and the manifest
      # must carry the requested version.
      - name: Verify requested source
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$EXPECTED_COMMIT" ]; then
            echo "checked out $ACTUAL but the dispatch requested $EXPECTED_COMMIT"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$EXPECTED_COMMIT" origin/main; then
            echo "$EXPECTED_COMMIT is not an ancestor of main; land it first"
            exit 1
          fi
          test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION"

      # npm's failure when trusted publishing does not line up is a bare 404 on
      # the PUT, which reads as "package missing" and sends people looking for a
      # token. Separate the two causes before publishing, so the log says which
      # one it is. Reports presence only — an OIDC token is a credential and is
      # never printed.
      - name: Preflight trusted publishing
        run: |
          set -euo pipefail
          echo "npm $(npm --version)  (OIDC requires >= 11.5.1)"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint. 'id-token: write' is not in effect —"
            echo "::error::check repository/organization Actions permissions. Publishing"
            echo "::error::would fail with a misleading 404."
            exit 1
          fi
          echo "OIDC token endpoint present; id-token: write is in effect."
          # setup-node writes an .npmrc pinning _authToken to NODE_AUTH_TOKEN.
          # With no token set that expands to an empty credential, and npm can
          # take "a credential is configured" as reason not to run the OIDC
          # exchange at all — producing this exact 404. Report it by name and
          # strip the empty line; a real token would not be empty.
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC" ] && grep -qE '_authToken=(\s*|\$\{NODE_AUTH_TOKEN\})$' "$NPMRC"; then
            echo "note: removing an empty _authToken line from $NPMRC"
            sed -i -E '/_authToken=(\s*|\$\{NODE_AUTH_TOKEN\})$/d' "$NPMRC"
          fi
          # Measured 2026-08-22, from the verbose publish log: GitHub issues the
          # OIDC token (GET .../idtoken?audience=npm:registry.npmjs.org -> 200),
          # then npm POSTs it to
          #   /-/npm/v1/oidc/token/exchange/package/<pkg>
          # which answers 404 with "OIDC token exchange error - package not
          # found". That endpoint is per-package, and "package not found" is
          # npm's wording for "no trusted publisher registered for it" — the
          # package itself is public and obviously exists. npm then falls back
          # to token auth and reports ENEEDAUTH.
          #
          # So ENEEDAUTH here means "no record", never "create a token".
          echo "If publish fails ENEEDAUTH or 404, the npm-side record does not match:"
          echo "  repository must be   ${GITHUB_REPOSITORY}"
          echo "  workflow file be     $(basename "${GITHUB_WORKFLOW_REF%%@*}")"
          echo "  environment must be  (none)"

      - run: npm ci

      # The full local gate — lint, tests, build, smoke, and audit — run here
      # explicitly rather than left to fire implicitly during publish, so a
      # failure is attributable to a step instead of to `npm publish`.
      - run: npm run prepublishOnly

      - name: Verify reproducible tracked output
        run: git diff --exit-code

      - run: npm pack --dry-run --json

      # `--ignore-scripts` because prepublishOnly already ran above; without it
      # the whole gate runs a second time.
      # Verbose so the OIDC exchange is visible: the failure mode we hit was npm
      # not attempting it at all, which is indistinguishable from a bad token
      # unless you can see the request. Output is filtered to the relevant lines
      # and passed through a redactor — this log is public, and npm's own
      # redaction is not something to stake a credential on. `pipefail` keeps
      # the publish's exit status.
      - name: Publish through npm trusted publishing
        run: |
          set -o pipefail
          npm publish --access public --ignore-scripts --loglevel verbose 2>&1 \
            | grep -iE 'oidc|trusted|provenance|exchange|attestation|npm (http|error|warn)|4[0-9]{2}|registry' \
            | sed -E 's#(eyJ[A-Za-z0-9_-]{10,})#[REDACTED-JWT]#g; s#(npm_[A-Za-z0-9]{10,})#[REDACTED-TOKEN]#g; s#(([Bb]earer|[Tt]oken|[Aa]uthorization)[=:]\s*)\S+#\1[REDACTED]#g'
